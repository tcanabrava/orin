# The Rust cdylib is large (>100 MB stripped), so packaging it needs more
# heap than Gradle's default.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Only arm64 is built today (see app/build.gradle.kts's cargo-ndk task). Every
# phone worth targeting is arm64; adding armeabi-v7a means another full Rust
# build and roughly doubles the APK.
android.defaults.buildfeatures.buildconfig=false
