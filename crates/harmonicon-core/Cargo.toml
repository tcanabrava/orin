[package]
name = "harmonicon-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Deliberately no Bevy. This is the pure-logic layer — music theory, chart
# types, scoring maths, MIDI/pitch conversion — so it compiles and tests in
# a couple of seconds instead of waiting on the engine. Keep it that way:
# anything needing `Resource`, `Component` or an `App` belongs a level up.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
midly = { workspace = true }

# Small MIDI-event constructors used by tests on both sides of the crate
# boundary. `#[cfg(test)]` only applies when *this* crate is the test target,
# so the game's tests need them switched on explicitly (as a dev-dependency).
[features]
test-support = []

[lints]
workspace = true
