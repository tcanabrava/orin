[package]
name = "harmonicon-song"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
harmonicon-core = { path = "../harmonicon-core" }
harmonicon-audio = { path = "../harmonicon-audio" }
harmonicon-platform = { path = "../harmonicon-platform" }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
midly = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/dynamic_linking", "bevy/debug", "harmonicon-audio/dev", "harmonicon-platform/dev"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-audio/trace_tracy", "harmonicon-platform/trace_tracy"]

[lints]
workspace = true
