[package]
name = "harmonicon-gameplay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-platform = { path = "../harmonicon-platform", version = "*" }
harmonicon-song = { path = "../harmonicon-song", version = "*" }
harmonicon-app = { path = "../harmonicon-app", version = "*" }
harmonicon-ui = { path = "../harmonicon-ui", version = "*" }
bevy = { workspace = true }
bevy_fluent = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/dynamic_linking", "bevy/debug", "harmonicon-ui/dev", "harmonicon-song/dev"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-ui/trace_tracy", "harmonicon-song/trace_tracy"]

[lints]
workspace = true
