[package]
name = "harmonicon-audio"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Microphone capture and pitch detection. Sits directly above
# harmonicon-core (which owns the pure pitch/MIDI maths) and below
# everything else — it knows nothing about songs, scoring or UI.
[dependencies]
harmonicon-core = { path = "../harmonicon-core" }
harmonicon-dsp = { path = "../harmonicon-dsp" }
serde = { workspace = true }
bevy = { workspace = true }
cpal = { workspace = true }
rustfft = { workspace = true }
crossbeam-channel = { workspace = true }
rodio = { workspace = true }

# Reading `RECORD_AUDIO`'s state means calling into the Java activity, so
# these are only pulled in where that activity exists. `ndk-context` holds the
# JavaVM/Activity pointers `android-activity` publishes at startup.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
dev = ["bevy/dev", "bevy/debug"]
dynamic_linking = ["bevy/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy"]

[lints]
workspace = true
