[package]
name = "harmonicon-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
harmonicon-core = { path = "../harmonicon-core" }
harmonicon-audio = { path = "../harmonicon-audio" }
harmonicon-platform = { path = "../harmonicon-platform" }
harmonicon-song = { path = "../harmonicon-song" }
harmonicon-app = { path = "../harmonicon-app" }
bevy_fluent = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
bevy = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/dynamic_linking", "bevy/debug", "harmonicon-platform/dev", "harmonicon-song/dev"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-platform/trace_tracy", "harmonicon-song/trace_tracy"]

[lints]
workspace = true
