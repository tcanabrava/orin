name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Enforce the Commits convention (CLAUDE.md) on *new* commits only.
  # pull_request-only and scoped to the PR's own range: existing history
  # carries the trailer and is deliberately not being rewritten.
  commit_messages:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject the Co-Authored-By trailer
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          bad=$(git log --format='%H %s%n%b' "$range" | grep -i '^Co-Authored-By:' || true)
          if [ -n "$bad" ]; then
            echo "::error::CLAUDE.md forbids the Co-Authored-By trailer; found it in this PR:"
            git log --format='  %h %s' "$range" --grep='^Co-Authored-By:' -i
            exit 1
          fi
          echo "no Co-Authored-By trailers in $range"

  # Run cargo test
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.toml') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Run cargo test
        run: cargo test --workspace

  # Run cargo clippy -- -D warnings
  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.toml') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      # --all-targets: the plain form skips the binaries in src/bin, the
      # tests and build.rs, which is most of what a review actually breaks.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run clippy with the dev feature
        run: cargo clippy --workspace --all-targets --features dev -- -D warnings

  # Run cargo deny check (licenses, advisories, sources)
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

  # Keep the wasm target compiling. The library only: the helper binaries
  # in src/bin are desktop tools and were never meant to run in a browser.
  wasm_check:
    name: Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.toml') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Run cargo check
        run: cargo check --target wasm32-unknown-unknown

  # Type-checks the Android target.
  #
  # This needs a real NDK, unlike the wasm job: the GameActivity backend
  # compiles GameActivity.cpp (vendored in the `android-activity` crate), and
  # blake3 builds a C SIMD backend. GitHub's ubuntu runners ship an NDK, so
  # nothing is downloaded here — but the toolchain has to be on PATH with the
  # right API level, which is exactly what `cargo ndk` sets up. A plain
  # `cargo check` fails with `ToolNotFound: aarch64-linux-android-clang++`.
  #
  # `-p harmonicon-android` is correct *because* the Android-only bevy
  # feature selection lives in that crate's own Cargo.toml. Move it back to
  # the root package and this silently loses the activity backend.
  #
  # This checks compilation only. Building an actual APK additionally needs
  # the SDK, a JDK and Gradle — see packaging/android/ and contributing/src/android-build.md.
  android_check:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.toml') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # API 28 is not arbitrary: cpal's Android backend links libaaudio, which
      # only exists in the NDK sysroot from API 26 up. It must stay in step
      # with minSdk in packaging/android/app/build.gradle.kts.
      # Deliberately sets no NDK env var. The runner already exports a valid
      # ANDROID_NDK_ROOT and cargo-ndk reads it; an earlier attempt to set
      # ANDROID_NDK_HOME from ${{ env.ANDROID_NDK_LATEST_HOME }} resolved to
      # the *empty string* (that variable isn't visible in a workflow `env:`
      # context), and an empty ANDROID_NDK_HOME beats the correct
      # ANDROID_NDK_ROOT — failing with "Error detecting NDK version for
      # path" and a bare "No such file or directory".
      - name: Run cargo ndk check
        run: cargo ndk -t arm64-v8a -P 28 check -p harmonicon-android

  # Run cargo fmt --all -- --check
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
